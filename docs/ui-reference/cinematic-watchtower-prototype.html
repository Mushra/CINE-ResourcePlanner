<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinematic Watchtower — Unified Prototype</title>
<style>
:root{
  --bg:#0C0E11; --panel:#15181D; --panel2:#1B1F26; --panel3:#20252D; --border:#282E38; --border-soft:#20242C;
  --text:#E6E9ED; --muted:#8A93A3; --muted2:#5C6470;
  --ahead:#3FCF9E; --ontrack:#5B9AF0; --atrisk:#F0B54A; --blocked:#F0616B; --late:#C77DF0;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);}
body{display:flex;min-width:1150px;}
#sidebar{width:170px;flex:none;background:var(--panel);border-right:1px solid var(--border-soft);height:100vh;position:sticky;top:0;padding:18px 10px;}
#sidebar .logo{font-size:12px;color:var(--muted2);letter-spacing:.06em;padding:0 8px 16px;}
#sidebar a{display:block;padding:8px 10px;border-radius:5px;color:var(--muted);font-size:13px;margin-bottom:2px;cursor:pointer;}
#sidebar a.on{background:var(--panel3);color:var(--text);}
#sidebar .subnav{margin:4px 0 0 10px;padding-left:8px;border-left:1px solid var(--border-soft);}
#sidebar .subnav a{font-size:12.5px;padding:6px 10px;}
main{flex:1;padding:22px 26px;min-width:0;}
.wrap{max-width:1180px;}
h2{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;}
h2 .n{color:var(--muted2);text-transform:none;font-weight:400;}
.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:6px;padding:16px 18px;margin-bottom:14px;}
.crumb{font-size:12px;color:var(--muted2);margin-bottom:14px;}
.crumb span.cl{cursor:pointer;color:var(--muted);}
.crumb span.cl:hover{color:var(--ontrack);}
.crumb .sep{margin:0 6px;}
.crumb .cur{color:var(--text);}
select,input,button{font-family:var(--font);}

/* generic rows/badges reused across screens */
.row-click{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;cursor:pointer;border-radius:4px;}
.row-click:hover{background:var(--panel2);}
.row-click+.row-click{border-top:1px solid var(--border-soft);}
.ic-warn{color:var(--atrisk);flex:none;}
.viewall{background:none;border:none;color:var(--ontrack);font-size:12px;cursor:pointer;float:right;}
.state-pill{border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:11px;color:var(--muted);}

/* Control Room */
.strip{display:flex;border:1px solid var(--border-soft);border-radius:6px;overflow:hidden;}
.strip button{flex:1;background:var(--panel);border:none;border-right:1px solid var(--border-soft);color:var(--text);padding:12px 8px;cursor:pointer;text-align:left;}
.strip button:last-child{border-right:none;}
.strip button:hover,.strip button.on{background:var(--panel2);}
.strip .num{font-size:20px;font-weight:600;}
.strip .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
.clearbar{display:none;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;}
.clearbar.show{display:flex;}
.clearbar button{background:none;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 9px;cursor:pointer;font-size:12px;}
.axis{display:grid;grid-template-columns:150px 1fr;font-size:11px;color:var(--muted2);margin-bottom:6px;min-width:700px;}
.axis .days{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;}
.outlook-scroll{overflow-x:auto;}
.cin-block{min-width:700px;}
.cin-block .t{font-size:13px;font-weight:600;margin:12px 0 4px;color:#C7CCD3;}
.orow{display:grid;grid-template-columns:150px 1fr;align-items:center;height:28px;}
.orow .dn{font-size:12px;color:var(--muted);}
.track{position:relative;height:100%;border-top:1px dashed var(--border-soft);}
.dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;cursor:pointer;border:2px solid var(--bg);}
.bar-row{display:grid;grid-template-columns:32px 1fr 66px;align-items:center;gap:10px;margin:8px 0;font-size:13px;}
.bar-track{background:var(--panel2);border-radius:3px;height:14px;overflow:hidden;}
.bar-fill{height:100%;background:var(--ontrack);}

/* Matrix */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:relative;}
#search{background:var(--panel);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:8px 12px;font-size:13px;width:220px;}
.tspacer{flex:1;}
.tool-wrap{position:relative;}
.tbtn{background:var(--panel);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:8px 12px;font-size:13px;cursor:pointer;}
.tbtn:hover{background:var(--panel2);}
.popover{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--panel3);border:1px solid var(--border);border-radius:6px;padding:12px;min-width:190px;z-index:50;box-shadow:0 10px 28px rgba(0,0,0,.45);}
.popover.open{display:block;}
.popover h4{font-size:11px;color:var(--muted);text-transform:uppercase;margin:10px 0 6px;}
.popover h4:first-child{margin-top:0;}
.popover label{display:flex;gap:7px;font-size:13px;padding:3px 0;cursor:pointer;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{display:inline-flex;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted);}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;}
.clearall{background:none;border:none;color:var(--ontrack);font-size:12px;cursor:pointer;}
.matrix-wrap{border:1px solid var(--border-soft);border-radius:6px;overflow:auto;max-height:560px;}
table.mx{border-collapse:collapse;width:100%;font-size:13px;}
table.mx th,table.mx td{padding:8px 13px;border-bottom:1px solid var(--border-soft);white-space:nowrap;text-align:left;}
table.mx thead th{background:var(--panel2);position:sticky;top:0;z-index:2;color:var(--muted);font-size:11px;text-transform:uppercase;cursor:pointer;}
td.cinc,th.cinc{position:sticky;left:0;background:var(--panel);z-index:1;}
thead th.cinc{z-index:3;background:var(--panel2);}
tbody tr:hover td{background:var(--panel2);}
.cin-name{cursor:pointer;font-weight:600;}
.cin-name:hover{color:var(--ontrack);}
.na{color:var(--muted2);}
.dc{cursor:pointer;line-height:1.4;}
.dc:hover{outline:1px solid var(--border);outline-offset:-1px;}
.dl{font-weight:600;}
.ds{color:var(--muted);font-size:12px;}
tr.gh td{background:var(--panel3);position:sticky;left:0;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted);}
tr.hidden{display:none;}

/* Cinematic Detail */
.hd-top{display:flex;justify-content:space-between;align-items:flex-start;}
.hd-top h1{font-size:19px;margin:0;}
.hd-title{color:var(--muted);font-size:13px;margin-top:2px;}
.hd-facts{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;align-items:center;font-size:13px;}
.hd-health{font-weight:700;}
.hd-fact .l{color:var(--muted2);font-size:10px;text-transform:uppercase;display:block;}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tab{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:7px 13px;font-size:12px;color:var(--muted);cursor:pointer;}
.tab.on{background:var(--panel3);color:var(--text);border-color:#3A4150;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.player{background:linear-gradient(135deg,#1c222c,#0a0c10 70%);border-radius:5px;aspect-ratio:16/8.5;position:relative;overflow:hidden;cursor:pointer;}
.player .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
.pbar{position:absolute;bottom:0;left:0;right:0;height:5px;background:rgba(255,255,255,.15);}
.pfill{height:100%;background:var(--ontrack);width:0;}
.vmeta{margin-top:9px;font-size:13px;}
.vmeta .date{color:var(--muted);font-size:12px;}
.flowbtn,.loqbtn{margin-top:8px;margin-right:6px;background:none;border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:5px;font-size:12px;cursor:pointer;}
.flowbtn:hover,.loqbtn:hover{background:var(--panel2);}
.prow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.prow span:first-child{color:var(--muted);}
.hl-row{display:flex;align-items:center;gap:9px;padding:6px 4px;cursor:pointer;border-radius:4px;font-size:13px;}
.hl-row:hover{background:var(--panel2);}
.hl-dot{width:6px;height:6px;border-radius:50%;flex:none;}
.hl-title{flex:1;}
.bugstats{display:flex;border:1px solid var(--border-soft);border-radius:5px;overflow:hidden;}
.bugstats div{flex:1;padding:12px 6px;text-align:center;border-right:1px solid var(--border-soft);}
.bugstats div:last-child{border-right:none;}
.bugstats .n{font-size:18px;font-weight:600;}
.bugstats .l{font-size:11px;color:var(--muted);text-transform:uppercase;}

/* LOQ Detail */
.lq-level{font-size:19px;font-weight:700;}
.lq-cin{color:var(--muted);font-size:13px;margin-top:3px;}
.lq-states{display:flex;gap:22px;margin-top:14px;}
.lq-health{font-size:16px;font-weight:700;}
.dep-label{text-align:center;font-size:10px;color:var(--muted2);letter-spacing:.08em;margin:6px 0;}
.dep-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
.node{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;text-align:center;cursor:pointer;min-width:120px;}
.node.affected{border-color:var(--blocked);box-shadow:0 0 0 1px var(--blocked) inset;}
.node.affected .tag{font-size:9px;color:var(--blocked);margin-top:4px;}
.node.current{background:var(--panel3);border:2px solid var(--ontrack);min-width:170px;padding:14px 16px;}
.node.current .tag{font-size:9px;color:var(--ontrack);margin-top:6px;}
.arrow{text-align:center;color:var(--muted2);font-size:16px;}
.viewhist{background:none;border:none;color:var(--ontrack);font-size:12px;cursor:pointer;padding:8px 0 0;}
#histBody{display:none;margin-top:10px;}
#histBody.open{display:block;}
.hev{padding:8px 0;border-top:1px solid var(--border-soft);font-size:13px;}
.hev .d{color:var(--muted2);font-size:11px;}

/* drawer/modal */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:70;}
#overlay.show{display:block;}
#drawer{position:fixed;top:0;right:-380px;width:360px;height:100%;background:var(--panel);border-left:1px solid var(--border);z-index:71;transition:right .18s ease;padding:20px;overflow-y:auto;}
#drawer.open{right:0;}
#drawer .close{float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
#drawer h3{font-size:15px;margin:0 0 10px;}
#drawer .k{color:var(--muted2);font-size:10px;text-transform:uppercase;margin-top:12px;}
#drawer .v{font-size:13px;margin-top:3px;color:#C7CCD3;}
#drawer .cta{margin-top:16px;width:100%;background:var(--ontrack);border:none;color:#0C0E11;font-weight:600;padding:9px;border-radius:5px;cursor:pointer;font-size:13px;}
#modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:22px;z-index:72;display:none;width:360px;}
#modal.show{display:block;}
#modal p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 14px;}
#modal button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:5px;cursor:pointer;font-size:13px;}
</style>
</head>
<body>
<div id="sidebar">
  <div class="logo">WATCHTOWER</div>
  <a>Dashboard</a><a>Timeline</a><a class="on">Projects</a>
  <div class="subnav">
    <a id="navControl" onclick="goControl()">Control Room</a>
    <a id="navMatrix" onclick="goMatrix()">Cinematics</a>
  </div>
</div>
<main><div class="wrap">
  <div class="crumb" id="crumb"></div>
  <div id="view"></div>
</div></main>
<div id="overlay"></div><div id="drawer"></div><div id="modal"></div>

<script>
/* ============ SHARED DATA MODEL ============ */
const DISC=['Animation','Cinematic Design','VFX','Lighting','Props','Tech Animation'];
const HEALTHS=['Ahead','On Track','At Risk','Blocked','Late'];
const HORDER=['Ahead','On Track','At Risk','Late','Blocked'];
const STATUSES=['Planned','In Progress','On Hold','Done'];
const ICON={Planned:'◷','In Progress':'◉','On Hold':'‖',Done:'✓'};
const HICON={Ahead:'▲','On Track':'●','At Risk':'⚠',Blocked:'⛔',Late:'●'};
const HC={Ahead:'ahead','On Track':'ontrack','At Risk':'atrisk',Blocked:'blocked',Late:'late'};
const TODAY=new Date('2026-09-25');
function fmtD(off){const d=new Date(TODAY);d.setDate(d.getDate()+off);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(arr,r){return arr[Math.floor(r*arr.length)];}
const REASON={'At Risk':'Upstream delivery threatens target','Blocked':null,'Late':'Target date exceeded'};

function genCin(idx){
  const rnd=mulberry32(9000+idx);
  const titles=['Ashes of the Old Guard','Signal in the Dark','A Promise Kept','The Last Convoy','Echoes at Dawn','Beneath the Ridge','Into the Static','The Long Silence','A Quiet Betrayal'];
  const disc={};
  DISC.forEach(dn=>{
    if(rnd()<0.16){disc[dn]=null;return;}
    const loq=pick(['L1','L2','L3'],rnd());
    const r=rnd();
    const health = r<0.5?'On Track':r<0.62?'Ahead':r<0.80?'At Risk':r<0.92?'Blocked':'Late';
    const status = health==='Ahead'?pick(['Done','In Progress'],rnd()) : pick(STATUSES,rnd());
    disc[dn]={loq,status,health,target:Math.floor(rnd()*20)-6,effortC:1+Math.floor(rnd()*6),effortE:4+Math.floor(rnd()*6),
      versions:1+Math.floor(rnd()*20),lastPush:Math.floor(rnd()*10),vId:'v'+String(1+Math.floor(rnd()*30)).padStart(3,'0'),jira:dn.slice(0,3).toUpperCase()+'-'+(100+Math.floor(rnd()*800))};
  });
  const active=DISC.filter(d=>disc[d]);
  const worst=active.reduce((w,d)=>HORDER.indexOf(disc[d].health)>HORDER.indexOf(disc[w].health)?d:w,active[0]||DISC[0]);
  const health=active.length?disc[worst].health:'On Track';
  const attention=active.filter(d=>['At Risk','Blocked','Late'].includes(disc[d].health)).map(d=>{
    const h=disc[d].health;
    let blockedBy=null;
    if(h==='Blocked'){blockedBy=pick(active.filter(x=>x!==d),rnd())||null;}
    return {disc:d,loq:disc[d].loq,problem:h==='Blocked'?`Blocked by ${blockedBy||'an upstream dependency'}`:REASON[h],
      impact:h==='Blocked'?`${d} ${disc[d].loq} cannot progress`:'Downstream delivery at risk',
      source: h==='Blocked'?'Watchtower':(rnd()<0.5?'Watchtower':'Jira'), priority:HORDER.indexOf(h)*10+Math.floor(rnd()*5), blockedBy};
  });
  const hotlines=Array.from({length:2+Math.floor(rnd()*5)},()=>({title:pick(['Export glitch','Cache mismatch','Playback issue','Rig error','Shader flicker','Camera export issue'],rnd()),disc:pick(active.length?active:DISC,rnd()),status:pick(['Open','Done'],rnd())}));
  const bugs={}; DISC.forEach(d=>bugs[d]=disc[d]?{open:Math.floor(rnd()*2),closed:Math.floor(rnd()*9),wf:Math.floor(rnd()*3),reo:0}:{open:0,closed:0,wf:0,reo:0});
  return {id:'CIN_'+String(idx).padStart(3,'0'),title:pick(titles,rnd()),health,state:pick(['Active','Active','On Hold'],rnd()),
    target:Math.floor(rnd()*14)-4,batch: rnd()<0.7?String(1+Math.floor(rnd()*8)).padStart(2,'0'):null,disc,worstDiscipline:worst,attention,hotlines,bugs};
}

// CIN_018 hand-authored flagship example (matches the validated narrative)
const CIN_018={
  id:'CIN_018',title:'The Hero Enters the Room',health:'At Risk',state:'Active',target:2,batch:'07',
  disc:{
    'Animation':{loq:'L2',status:'In Progress',health:'At Risk',target:2,effortC:3.5,effortE:5,versions:23,lastPush:1,vId:'v023',jira:'ANIM-482'},
    'Cinematic Design':{loq:'L2',status:'Done',health:'On Track',target:-3,effortC:4,effortE:5,versions:11,lastPush:5,vId:'v011',jira:'CDES-101'},
    'VFX':{loq:'L1',status:'Planned',health:'At Risk',target:-1,effortC:0,effortE:3,versions:6,lastPush:3,vId:'v006',jira:'VFX-227'},
    'Lighting':{loq:'L2',status:'Planned',health:'Blocked',target:4,effortC:0,effortE:4,versions:14,lastPush:2,vId:'v014',jira:'LGT-233'},
    'Props':{loq:'L1',status:'Done',health:'On Track',target:-6,effortC:1,effortE:2,versions:4,lastPush:7,vId:'v004',jira:'PROP-050'},
    'Tech Animation':{loq:'L1',status:'Done',health:'On Track',target:-8,effortC:1,effortE:2,versions:2,lastPush:9,vId:'v002',jira:'TA-070'}
  },
  worstDiscipline:'Animation',
  attention:[
    {disc:'Animation',loq:'L2',problem:'Mocap Batch 07 is 2 days late',impact:'Animation L2 cannot start as planned',source:'Production Planning',priority:90,blockedBy:null},
    {disc:'Animation',loq:'L2',problem:'TA-482 remains unresolved',impact:'Animation delivery may be delayed',source:'Jira',priority:88,blockedBy:null},
    {disc:'Lighting',loq:'L2',problem:'Blocked by Animation L2',impact:'Lighting L2 cannot start',source:'Watchtower',priority:85,blockedBy:'Animation'},
    {disc:'VFX',loq:'L1',problem:'Target date exceeded',impact:'VFX delivery is late',source:'Watchtower',priority:70,blockedBy:null}
  ],
  hotlines:[
    {title:'Animation cache issue',disc:'Animation',status:'Open'},{title:'Lighting setup problem',disc:'Lighting',status:'Open'},
    {title:'VFX shader crash',disc:'VFX',status:'Open'},{title:'Camera export issue',disc:'Cinematic Design',status:'Done'},
    {title:'Props collision issue',disc:'Props',status:'Done'},{title:'Rig export failure',disc:'Tech Animation',status:'Done'},
    {title:'Animation playback stutter',disc:'Animation',status:'Done'}
  ],
  bugs:{'Animation':{open:1,closed:10,wf:4,reo:0},'Cinematic Design':{open:0,closed:6,wf:2,reo:0},'VFX':{open:1,closed:7,wf:3,reo:0},
    'Lighting':{open:1,closed:5,wf:2,reo:0},'Props':{open:1,closed:2,wf:1,reo:0},'Tech Animation':{open:0,closed:1,wf:0,reo:0}}
};
const CINS=[CIN_018, ...[12,21,24,27,31,34,41,45,52].map(genCin)];
function cinById(id){return CINS.find(c=>c.id===id);}

/* ============ APP STATE / NAV ============ */
const state={screen:'control', cinId:'CIN_018', discipline:'ALL', loqDisc:'Animation',
  control:{filter:null},
  matrix:{search:'',group:localStorage.getItem('wtm_group')||'None',
    cols:JSON.parse(localStorage.getItem('wtm_cols')||'null')||Object.fromEntries(DISC.map(d=>[d,true])),
    filters:{Health:new Set(),Discipline:new Set(),LOQ:new Set(),Status:new Set()},sort:{col:'CIN',dir:'asc'},collapsed:new Set()}};

function goControl(){state.screen='control';render();}
function goMatrix(){state.screen='matrix';render();}
function goDetail(cinId){state.screen='detail';state.cinId=cinId;state.discipline='ALL';render();}
function goLoq(cinId,disc){state.screen='loq';state.cinId=cinId;state.loqDisc=disc;render();}

function renderCrumb(){
  const c=cinById(state.cinId);
  let html=`<span class="cl" onclick="mockNav('Projects list')">Projects</span><span class="sep">/</span>`;
  if(state.screen==='control'){html+=`<span class="cur">Project Alpha</span>`;}
  else{
    html+=`<span class="cl" onclick="goControl()">Project Alpha</span><span class="sep">/</span>`;
    if(state.screen==='matrix'){html+=`<span class="cur">Cinematics</span>`;}
    else{
      html+=`<span class="cl" onclick="goMatrix()">Cinematics</span><span class="sep">/</span>`;
      if(state.screen==='detail'){html+=`<span class="cur">${c.id}</span>`;}
      else{
        html+=`<span class="cl" onclick="goDetail('${c.id}')">${c.id}</span><span class="sep">/</span><span class="cur">${state.loqDisc} ${c.disc[state.loqDisc].loq}</span>`;
      }
    }
  }
  document.getElementById('crumb').innerHTML=html;
  document.getElementById('navControl').classList.toggle('on',state.screen==='control');
  document.getElementById('navMatrix').classList.toggle('on',state.screen!=='control');
}

/* ============ DRAWER / MODAL ============ */
function showDrawer(html){document.getElementById('drawer').innerHTML=`<button class="close" onclick="closeAll()">✕</button>${html}`;document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show');}
function showModal(html){document.getElementById('modal').innerHTML=`<p>${html}</p><button onclick="closeAll()">Close</button>`;document.getElementById('modal').classList.add('show');document.getElementById('overlay').classList.add('show');}
function closeAll(){document.getElementById('drawer').classList.remove('open');document.getElementById('modal').classList.remove('show');document.getElementById('overlay').classList.remove('show');}
function mockNav(where){showModal(`Would navigate to: <b>${where}</b> (outside Watchtower's scope in this reference).`);}

/* ============ CONTROL ROOM ============ */
function renderControl(){
  const counts={Ahead:0,'On Track':0,'At Risk':0,Blocked:0,Late:0};
  CINS.forEach(c=>DISC.forEach(d=>{if(c.disc[d])counts[c.disc[d].health]++;}));

function mxRenderChips(){

function mxRemoveChip(cat,v){state.matrix.filters[cat].delete(v);mxRenderChips();mxRender();}
function mxClearFilters(){Object.values(state.matrix.filters).forEach(s=>s.clear());mxRenderChips();mxRender();}
function mxPass(c){
  const s=state.matrix;
  if(s.search&&!c.id.toLowerCase().includes(s.search))return false;
  if(s.filters.Health.size&&!s.filters.Health.has(c.health))return false;
  if(s.filters.Discipline.size&&![...s.filters.Discipline].some(d=>c.disc[d]))return false;
  if(s.filters.LOQ.size&&!DISC.some(d=>c.disc[d]&&s.filters.LOQ.has(c.disc[d].loq)))return false;
  if(s.filters.Status.size){const st=cinStatus(c);if(!s.filters.Status.has(st))return false;}
  return true;
}
function cinStatus(c){const act=DISC.filter(d=>c.disc[d]);if(act.some(d=>c.disc[d].status==='On Hold'))return 'On Hold';if(act.some(d=>c.disc[d].status==='In Progress'))return 'In Progress';if(act.some(d=>c.disc[d].status==='Planned'))return 'Planned';return 'Done';}
function mxSort(rows){
  const {col,dir}=state.matrix.sort,mul=dir==='asc'?1:-1;
  if(col==='CIN')return[...rows].sort((a,b)=>mul*a.id.localeCompare(b.id));
  if(col==='Health')return[...rows].sort((a,b)=>mul*(HORDER.indexOf(a.health)-HORDER.indexOf(b.health)));
  const has=rows.filter(r=>r.disc[col]),na=rows.filter(r=>!r.disc[col]);
  has.sort((a,b)=>mul*a.disc[col].loq.localeCompare(b.disc[col].loq));
  return has.concat(na);
}
function mxOnSort(col){const s=state.matrix.sort;state.matrix.sort=s.col===col?{col,dir:s.dir==='asc'?'desc':'asc'}:{col,dir:'asc'};mxRender();}
function mxRowHtml(c){
  const cols=DISC.filter(d=>state.matrix.cols[d]);
  return `<tr><td class="cinc"><span class="cin-name" onclick="goDetail('${c.id}')">${c.id}</span></td>
    <td><div style="font-weight:600;font-size:12px;color:var(--${HC[c.health]})">${c.health.toUpperCase()}</div>${c.attention.length?`<div style="color:var(--muted2);font-size:11px;">${c.attention.length} issue${c.attention.length>1?'s':''}</div>`:''}</td>
    ${cols.map(d=>{const e=c.disc[d];if(!e)return `<td class="na">N/A</td>`;
      return `<td class="dc" onclick="mxOpenLoq('${c.id}','${d}')"><div class="dl">${e.loq}</div><div class="ds">${e.status} ${ICON[e.status]}</div></td>`;}).join('')}</tr>`;
}
function mxGroupKey(c,g){if(g==='Health')return c.health;if(g==='Status')return cinStatus(c);if(g==='Discipline')return c.worstDiscipline;if(g==='Mocap Batch')return c.batch||'Unassigned';return null;}
function mxRender(){
  const s=state.matrix,cols=['CIN','Health',...DISC.filter(d=>s.cols[d])];
  document.getElementById('headRow').innerHTML=cols.map(c=>{const arrow=s.sort.col===c?`<span>${s.sort.dir==='asc'?'▲':'▼'}</span>`:'';return `<th class="${c==='CIN'?'cinc':''}" onclick="mxOnSort('${c}')">${c.toUpperCase()} ${arrow}</th>`;}).join('');
  let rows=CINS.filter(mxPass);const body=document.getElementById('mxBody');
  if(s.group==='None'){body.innerHTML=mxSort(rows).map(mxRowHtml).join('')||`<tr><td colspan="8" style="color:var(--muted)">No cinematics match your filters.</td></tr>`;return;}
  const groups={};rows.forEach(c=>{const k=mxGroupKey(c,s.group);(groups[k]=groups[k]||[]).push(c);});
  const keys=Object.keys(groups).sort();
  body.innerHTML=keys.map(k=>{const collapsed=s.collapsed.has(k),g=mxSort(groups[k]);
    return `<tr class="gh" onclick="mxToggleGroup('${k}')"><td colspan="8">${collapsed?'▸':'▾'} ${k} · ${g.length} CIN</td></tr>`+g.map(c=>collapsed?mxRowHtml(c).replace('<tr>','<tr class="hidden">'):mxRowHtml(c)).join('');}).join('')||`<tr><td colspan="8" style="color:var(--muted)">No cinematics match your filters.</td></tr>`;
}
function mxToggleGroup(k){state.matrix.collapsed.has(k)?state.matrix.collapsed.delete(k):state.matrix.collapsed.add(k);mxRender();}

    <div class="panel"><h2>EXECUTION</h2>
      <div class="prow"><span>Status</span><span>${e.status} ${ICON[e.status]}</span></div><div class="prow"><span>Health</span><span style="color:var(--${HC[e.health]})">${e.health}</span></div>
      <div class="prow"><span>Target</span><span>${fmtD(e.target)}</span></div><div class="prow"><span>Effort</span><span>${e.effortC} / ${e.effortE} days (consumed/estimated)</span></div>
      <div class="prow"><span>Versions</span><span>${e.versions}</span></div><div class="prow"><span>Jira</span><span>${e.jira} · <span style="color:var(--ontrack);cursor:pointer;" onclick="showModal('Would open ${e.jira} in Jira.')">Open in Jira →</span></span></div>
      <button class="viewhist" id="histBtn" onclick="toggleHist()">View history ↓</button><div id="histBody">${loqHistHtml(e)}</div></div>`;
}
function loqNode(c,dn,isCurrent){
  const e=c.disc[dn];if(!e)return '';
  if(isCurrent)return `<div class="node current"><div style="font-weight:600;">${dn} ${e.loq}</div><div style="font-size:11px;margin-top:4px;color:var(--${HC[e.health]})">${HICON[e.health]} ${e.health.toUpperCase()}</div><div class="tag">CURRENT LOQ</div></div>`;
  const isDown=loqDeps(c,dn).down.includes(state.loqDisc)===false && dn!==state.loqDisc && (dn==='Lighting'||dn==='VFX') && state.loqDisc==='Animation';
  return `<div class="node ${isDown?'affected':''}" onclick="goLoq('${c.id}','${dn}')"><div style="font-weight:600;">${dn} ${e.loq}</div><div style="font-size:11px;margin-top:4px;color:var(--${HC[e.health]})">${HICON[e.health]} ${e.health.toUpperCase()}</div>${isDown?`<div class="tag">AFFECTED</div>`:''}</div>`;
}
function loqHistHtml(e){
  return [{d:fmtD(e.target-1),t:'Status',r:`Planned → ${e.status}`},{d:fmtD(e.target-e.effortE),t:'LOQ created',r:`Target: ${fmtD(e.target)}`}]
    .map(h=>`<div class="hev"><div class="d">${h.d}</div><div style="font-weight:600;">${h.t}</div><div style="color:var(--muted);font-size:12px;margin-top:2px;">${h.r}</div></div>`).join('');
}
let histOpen=false;
function toggleHist(){histOpen=!histOpen;document.getElementById('histBody').className=histOpen?'open':'';document.getElementById('histBtn').textContent=histOpen?'Hide history ↑':'View history ↓';}
function loqOpenAnomaly(i){
  const c=cinById(state.cinId),a=c.attention.filter(x=>x.disc===state.loqDisc)[i];
  showDrawer(`<h3>${a.problem}</h3><div class="k" style="margin-top:0;">Problem</div><div class="v">${a.problem}</div><div class="k">Impact</div><div class="v">${a.impact}</div><div class="k">Source</div><div class="v">${a.source}</div>${a.blockedBy?`<button class="cta" onclick="goLoq('${c.id}','${a.blockedBy}');closeAll()">Open related object →</button>`:''}`);
}

/* ============ DISPATCH ============ */
function render(){
  renderCrumb();
  if(state.screen==='control')renderControl();
  else if(state.screen==='matrix')renderMatrix();
  else if(state.screen==='detail')renderDetail();
  else renderLoq();
}
document.getElementById('overlay').onclick=closeAll;
render();
</script>
</body>
</html>
