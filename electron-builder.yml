appId: com.mushra.cine-resource-planner
productName: Cinematic Watchtower
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
extraResources:
  - from: resources/mpp
    to: mpp
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: Mushra
  repo: CINE-ResourcePlanner
  releaseType: release
